services:
  postgres-e2e:
    image: postgres:16
    environment:
      POSTGRES_DB: website_builder_e2e
      POSTGRES_USER: website_builder
      POSTGRES_PASSWORD: website_builder_e2e_password
    ports:
      - '127.0.0.1:5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U website_builder -d website_builder_e2e']
      interval: 2s
      timeout: 3s
      retries: 30
