spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/website_builder
    username: website_builder
    password: website_builder_dev_password
  servlet:
    multipart:
      max-request-size: 2MB
      max-file-size: 2MB
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

app:
  jwt:
    secret: dev-secret-key-must-be-at-least-32-chars-long-for-hs256-algorithm
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:4200,http://localhost:4201

cloudflare:
  r2:
    account-id: dev-account-placeholder
    access-key-id: dev-key-placeholder
    access-key-secret: dev-secret-placeholder
    bucket-name: dev-bucket-placeholder
    public-url-base: https://pub.sites.example.com

stripe:
  secret-key: sk_test_placeholder_dev
  webhook-secret: whsec_placeholder_dev
  plans:
    pro:
      price-id: price_placeholder_dev
